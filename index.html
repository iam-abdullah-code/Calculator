<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Calculator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="style.css">
  
  
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">

</head>

<body>
  <main class="app">
    <section class="calc" aria-label="Calculator">
      <div class="top"><span class="mem" id="memInd" title="Memory has a stored value">M</span><button class="icon-btn"
          id="openHist" type="button" aria-expanded="false" aria-controls="history">History</button></div>
      <div class="screen">
        <div class="expr" id="expr"></div>
        <div class="value" id="value" aria-hidden="true">0</div>
      </div>
      <div class="sr" id="sr" role="status" aria-live="polite"></div>
      <div class="keys" id="keys"></div>
    </section>
    <aside class="history" id="history" aria-label="Calculation history">
      <div class="hhead">
        <h2>History</h2>
        <div><button class="icon-btn" id="clearHist" type="button">Clear</button><button class="icon-btn" id="closeHist"
            type="button">Close</button></div>
      </div>
      <ul class="list" id="list"></ul>
    </aside>
  </main>
</body>

</html>
